checks:
  # Anomaly event for RETR without a preceding PORT or PASV.
  - filter:
      requires:
        min-version: 9.0
      count: 1
      match:
        event_type: anomaly
        anomaly.event: file_before_port

  # Alert on the event.
  - filter:
      requires:
        min-version: 9.0
      count: 1
      match:
        event_type: alert
        alert.signature_id: 2232003

  # RETR transaction logged with filename.
  - filter:
      requires:
        min-version: 9.0
      count: 1
      match:
        event_type: ftp
        ftp.command: RETR
        ftp.command_data: file.txt
